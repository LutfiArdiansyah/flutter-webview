name: webspace
description: "A Flutter application that displays webview from remote JSON configuration."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_animate: ^4.5.2
  flutter_inappwebview: 6.2.0-beta.3
  google_fonts: ^9.0.0
  http: ^1.6.0
  intl: ^0.20.3
  material_ui: ^1.8.0
  path: ^1.9.1
  sqflite: ^2.4.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  # Poppins is bundled so text renders without a network fetch (see main.dart).
  assets:
    - assets/google_fonts/Poppins-Regular.ttf
    - assets/google_fonts/Poppins-Medium.ttf
    - assets/google_fonts/Poppins-SemiBold.ttf
    - assets/google_fonts/Poppins-Bold.ttf
    - assets/google_fonts/OFL.txt
